command: [
  "streamlit",
  "run",
  "app.py",
]
env:
  - name: "DATABRICKS_HTTP_PATH"
    value: "/sql/1.0/warehouses/6a09f4ec67bb14b5"
  - name: "DATABRICKS_WAREHOUSE_ID"
    value: "6a09f4ec67bb14b5"
  - name: "DATABRICKS_SERVER_HOSTNAME"
    value: "fe-vm-ef-demo-workspace.cloud.databricks.com"
  - name: "CATALOG_NAME"
    value: "demos"
  - name: "SCHEMA_NAME"
    value: "access_control"
  - name: "ACCESS_TABLE"
    value: "group_customer_access"
  - name: "AUDIT_TABLE"
    value: "access_audit_log"
  - name: "ADMIN_GROUP"
    value: "access_admin"
  - name: "APP_TITLE"
    value: "Unity Catalog Access Management"
  - name: "PAGE_ICON"
    value: "UC"
  # --- Permission Explorer snapshot (Lakebase) ---
  - name: "LAKEBASE_INSTANCE"
    value: "account-intel-board"
  - name: "LAKEBASE_HOST"
    value: "ep-solitary-paper-d1ell5ot.database.us-west-2.cloud.databricks.com"
  - name: "LAKEBASE_DB"
    value: "databricks_postgres"
  - name: "LAKEBASE_SCHEMA"
    value: "abac"

resources:
  - name: sql_warehouse
    sql_warehouse:
      id: 6a09f4ec67bb14b5
      permission: CAN_USE
  # The app SP reads the permission snapshot from this Lakebase instance.
  - name: lakebase
    database:
      instance_name: account-intel-board
      permission: CAN_CONNECT_AND_CREATE
