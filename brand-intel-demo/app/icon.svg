<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Rounded square background -->
  <rect x="4" y="4" width="120" height="120" rx="24" ry="24" fill="#FF3621"/>

  <!-- Circuit branches radiating from corners -->
  <g stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.75">
    <polyline points="76,42 90,28 106,26"/>
    <polyline points="52,42 38,28 22,26"/>
    <polyline points="76,86 90,100 106,102"/>
    <polyline points="52,86 38,100 22,102"/>
    <line x1="84" y1="56" x2="100" y2="46"/>
    <line x1="44" y1="72" x2="28" y2="82"/>
  </g>

  <!-- Circuit endpoint nodes -->
  <g fill="#fff" opacity="0.8">
    <circle cx="106" cy="26" r="4"/>
    <circle cx="22" cy="26" r="4"/>
    <circle cx="106" cy="102" r="4"/>
    <circle cx="22" cy="102" r="4"/>
    <circle cx="100" cy="46" r="3"/>
    <circle cx="28" cy="82" r="3"/>
  </g>

  <!-- Four-point sparkle star (Genie style - tall, pinched waist) -->
  <path d="
    M 64 18
    C 63 46, 58 54, 52 58
    C 46 62, 30 63, 26 64
    C 30 65, 46 66, 52 70
    C 58 74, 63 82, 64 110
    C 65 82, 70 74, 76 70
    C 82 66, 98 65, 102 64
    C 98 63, 82 62, 76 58
    C 70 54, 65 46, 64 18
    Z
  " fill="#fff"/>
</svg>
