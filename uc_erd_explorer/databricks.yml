bundle:
  name: erd-explorer

# NOTE: No workspace host here on purpose — pick the target workspace from the CLI:
#   databricks bundle deploy -t dev -p <your-profile>
# The app queries system.information_schema via a SQL warehouse as its own service
# principal. After first deploy, grant the app's SP USE CATALOG / USE SCHEMA / BROWSE
# on `megacorp` (see README.md) so /api/graph can read the metadata.

# `databricks bundle deploy` respects .gitignore when syncing source files, and both the
# repo root and frontend/ .gitignore legitimately exclude dist/ (correct for git, since
# it's a build artifact). But the FastAPI backend serves frontend/dist/ at runtime, so it
# has to be part of the deployed bundle -- force-include it here regardless of gitignore.
# Run `cd frontend && npm run build` before every deploy so this dist/ is current.
sync:
  include:
    - "frontend/dist/**"

variables:
  warehouse_id:
    description: >-
      SQL warehouse id used to query system.information_schema. REQUIRED -- no default
      shipped on purpose (a warehouse id from this project's original workspace would
      silently fail in yours). Pass --var="warehouse_id=<your-warehouse-id>".
  erd_catalogs:
    description: >-
      Comma-separated catalog allow-list for the ERD graph. The packaged demo ships two
      catalogs cross-linked by a real foreign key (logistics.shipping.shipments ->
      megacorp.erp.sales_orders, see setup/create_logistics_demo.py) so multi-catalog
      rendering has something real to show -- not just multiple schemas in one catalog.
    default: "megacorp,logistics"
  erd_metadata_location:
    description: >-
      "catalog.schema" where the scoped ERD metadata views (Genie's actual data
      source -- see setup/create_scoped_views.py) live. If you change erd_catalogs to a
      different catalog, update this to "<that catalog>.erd_meta" (or wherever you want
      them) and re-run the setup_genie_space job.
    default: "megacorp.erd_meta"
  genie_space_id:
    description: >-
      Genie Space id for the popup chat. USUALLY LEAVE AS "not-configured": the app
      auto-discovers the space the setup_genie_space job creates (matched by a marker in
      the space description, made visible to the app SP via the CAN_RUN grant that same job
      applies -- see server/config.py resolve_genie_space_id() and README "Genie Space
      auto-discovery"). So the flow is just deploy -> run setup_genie_space, with no id to
      copy back and no redeploy. Set this to a real id only to PIN a specific space or skip
      discovery; an explicit value always wins. NOTE: must stay NON-EMPTY. An empty string
      renders as a null env value the Databricks Apps API rejects ("Must specify
      environment variable source using either value or valueFrom"); config.py's
      get_genie_space_id() treats the "not-configured" sentinel as unset.
    default: "not-configured"
  erd_metadata_source:
    description: >-
      Where the ERD graph reads metadata from. "information_schema" (default) queries the
      system tables live on every cache miss. "snapshot" reads the pre-materialized
      erd_snapshot_* Delta tables in erd_metadata_location (built by the
      refresh_erd_snapshot job), so the expensive information_schema joins never run on the
      request path. Snapshot mode falls back to live automatically if the snapshot tables
      aren't present yet, so it's safe to enable before the first refresh -- but for the
      speedup to actually take effect, run `databricks bundle run refresh_erd_snapshot`
      once after enabling (then it refreshes weekly on schedule). Only applies to Prod;
      the Prod/Test toggle's Test catalogs are always queried live.
    default: "information_schema"
  erd_cache_ttl_seconds:
    description: >-
      Seconds /api/graph results are cached in-memory before re-querying
      information_schema. Schema metadata changes rarely, so the default trades a
      little staleness for far fewer warehouse round-trips on repeated loads/filters.
    default: "3600"
  erd_rate_limit_per_min:
    description: >-
      Max /api/graph + /api/schema-tree requests per minute PER identity (logged-in user
      email in OBO mode, else client IP) before the app returns 429. Each of those loads
      fans out several warehouse statements, so this caps a runaway client (a tight retry
      loop, a refresh-happy tab) from racking up compute. The default is generous -- an
      interactive user never approaches it. In-process only: a Databricks App runs as one
      container, so this is effectively app-wide (per-replica if ever scaled out). Set to
      "0" to disable. NOTE: must stay NON-EMPTY (the Apps API rejects an empty env value).
    default: "120"
  erd_genie_rate_limit_per_min:
    description: >-
      Max /api/genie/ask requests per minute PER identity before the app returns 429 --
      tighter than erd_rate_limit_per_min because each Genie ask spends a Genie + warehouse
      round-trip. Set to "0" to disable. NOTE: must stay NON-EMPTY.
    default: "20"
  erd_schema_collapse_threshold:
    description: >-
      Table count above which the ERD defaults to one node per schema instead of one
      per table (click a schema node to expand it to full detail) -- a flat
      table-per-node layout gets slow to query and unreadable well before a few hundred
      nodes. Set to "0" to always render full detail regardless of catalog size.
    default: "80"
  erd_test_catalog_suffix:
    description: >-
      Suffix appended to each erd_catalogs entry when the frontend's Prod/Test toggle is
      set to Test (e.g. edp_customer -> edp_customer_ts) -- two distinct real Unity
      Catalog catalogs, not an alias. Only meaningful when erd_catalogs is set.
    default: "_ts"
  auth_mode:
    description: >-
      Which identity the ERD metadata queries run as. "service_principal" (default) queries
      system.information_schema as the app's own service principal, bounded by erd_catalogs
      -- the original behavior. "on_behalf_of_user" instead queries as the LOGGED-IN USER
      (via the token Databricks Apps forward in x-forwarded-access-token), so each user sees
      only the catalogs/schemas/tables THEY have UC privileges on, intersected with
      erd_catalogs. OBO additionally requires granting the app the "sql" user authorization
      scope (UI: app > Edit > User authorization > Add scope; or `databricks apps update
      <app> --json '{"user_api_scopes":["sql","iam.access-control:read","iam.current-user:read"]}'`),
      and each user needs CAN_USE on the SQL warehouse. Deploy OBO with
      --var="auth_mode=on_behalf_of_user".
    default: "service_principal"
  erd_admin_emails:
    description: >-
      Comma-separated allow-list of user emails permitted to trigger the in-app snapshot
      refresh (the "Refresh snapshot now" button runs a Jobs run-now that spends compute).
      "*" (default) leaves the admin action open to any app user -- fine for a
      single-user/internal deployment where app access == trust. Set specific emails (e.g.
      --var="erd_admin_emails=you@example.com,teammate@example.com") on any shared,
      multi-role, or customer deployment so only listed users can trigger a refresh.
      NOTE: must stay NON-EMPTY -- an empty string renders as a null env value the
      Databricks Apps API rejects; server/config.py's get_admin_emails() treats "*" (and
      empty) as "no restriction".
    default: "*"
  user_api_scopes:
    description: >-
      User authorization scopes the app requests on behalf of the logged-in user (OBO).
      MUST be declared here rather than set out-of-band via `apps update`: `bundle deploy`
      regenerates the app resource from this file and would otherwise reset the scopes
      back to default, silently stripping them. Empty by default (service_principal mode
      needs none). For OBO, deploy with --var='user_api_scopes=["sql"]' so the forwarded
      user token can call the SQL Statement Execution API.
    type: complex
    default: []

targets:
  dev:
    default: true
    mode: development
  prod:
    mode: production

  # Example on-behalf-of-user (OBO) target. OBO needs a complex `user_api_scopes` value,
  # which the CLI can't set via --var, so auth_mode + the scope list are set here at the
  # target level. Declaring the scope in the bundle (rather than out-of-band via
  # `apps update`) is what makes it survive `bundle deploy`, which regenerates the app
  # resource. No `host` (picked from your --profile, like dev/prod) and no `mode`
  # (`development` would prefix the app name with "[dev <user>]"). The OBO app's own
  # service principal needs no data-catalog grants (the ERD queries run as the logged-in
  # user); it still needs the Genie metadata-location grant, and each end user needs
  # CAN_USE on the warehouse plus their own catalog privileges. Deploy with:
  #   databricks bundle deploy -t obo -p <profile> --var="warehouse_id=..." --var="erd_catalogs=..."
  #   databricks bundle run erd_explorer_app -t obo -p <profile> --var="warehouse_id=..." --var="erd_catalogs=..."
  obo:
    variables:
      auth_mode: "on_behalf_of_user"
      user_api_scopes: ["sql"]

resources:
  apps:
    erd_explorer_app:
      name: "erd-explorer-${bundle.target}"
      description: "Interactive Unity Catalog ERD viewer (megacorp, logistics)"
      source_code_path: ./
      # User authorization scopes for on-behalf-of-user mode. Declared here so
      # `bundle deploy` sets them (and doesn't reset them) -- see var.user_api_scopes.
      # Empty in service_principal mode; ["sql"] for OBO.
      user_api_scopes: ${var.user_api_scopes}
      # ERD_CATALOGS is templated from the SAME var.erd_catalogs the setup job below
      # uses for the Genie Space -- one variable, two consumers, never drifts.
      config:
        command:
          - "python"
          - "-m"
          - "uvicorn"
          - "app:app"
          - "--host"
          - "0.0.0.0"
          - "--port"
          - "8000"
        env:
          - name: "DATABRICKS_WAREHOUSE_ID"
            value: ${var.warehouse_id}
          - name: "ERD_CATALOGS"
            value: ${var.erd_catalogs}
          - name: "GENIE_SPACE_ID"
            value: ${var.genie_space_id}
          - name: "ERD_CACHE_TTL_SECONDS"
            value: ${var.erd_cache_ttl_seconds}
          - name: "ERD_SCHEMA_COLLAPSE_THRESHOLD"
            value: ${var.erd_schema_collapse_threshold}
          - name: "ERD_TEST_CATALOG_SUFFIX"
            value: ${var.erd_test_catalog_suffix}
          - name: "ERD_AUTH_MODE"
            value: ${var.auth_mode}
          - name: "ERD_ADMIN_EMAILS"
            value: ${var.erd_admin_emails}
          - name: "ERD_METADATA_SOURCE"
            value: ${var.erd_metadata_source}
          - name: "ERD_METADATA_LOCATION"
            value: ${var.erd_metadata_location}
          - name: "ERD_RATE_LIMIT_PER_MIN"
            value: ${var.erd_rate_limit_per_min}
          - name: "ERD_GENIE_RATE_LIMIT_PER_MIN"
            value: ${var.erd_genie_rate_limit_per_min}
          # Job id for the admin "Refresh snapshot now" control (Jobs run-now). Templated
          # from the job resource below so it's always the right id post-deploy. NOTE: for
          # the button to work, the app's service principal needs CAN_MANAGE_RUN on this
          # job -- see README "Metadata snapshot" (the app surfaces a clear error if not).
          - name: "ERD_SNAPSHOT_JOB_ID"
            value: ${resources.jobs.refresh_erd_snapshot.id}
      resources:
        - name: sql-warehouse
          description: "Warehouse for information_schema metadata queries"
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: "CAN_USE"

  jobs:
    setup_genie_space:
      name: "erd-explorer-setup-genie-space-${bundle.target}"
      description: >-
        One-time/idempotent setup, two steps: (1) create the scoped metadata views
        that are Genie's actual hard-scoped data source, (2) create/update the Genie
        Space over those views. Re-run this job (databricks bundle run
        setup_genie_space) any time var.erd_catalogs or var.erd_metadata_location
        changes -- the app's /api/graph picks up a changed ERD_CATALOGS live, but the
        scoped views and the Genie Space's table list do not.
      tasks:
        - task_key: create_scoped_views
          environment_key: default
          spark_python_task:
            python_file: ./setup/create_scoped_views.py
            parameters:
              - "--warehouse-id"
              - ${var.warehouse_id}
              - "--catalogs"
              - ${var.erd_catalogs}
              - "--metadata-location"
              - ${var.erd_metadata_location}
        - task_key: create_genie_space
          depends_on:
            - task_key: create_scoped_views
          environment_key: default
          spark_python_task:
            python_file: ./setup/create_genie_space.py
            # No --profile on either task: on job compute the scripts use ambient
            # WorkspaceClient() auth (the job's identity), same dual-mode pattern as the
            # app itself.
            parameters:
              - "--warehouse-id"
              - ${var.warehouse_id}
              - "--catalogs"
              - ${var.erd_catalogs}
              - "--metadata-location"
              - ${var.erd_metadata_location}
              - "--grant-to-app"
              - "erd-explorer-${bundle.target}"
      environments:
        - environment_key: default
          spec:
            client: "3"
            dependencies:
              - databricks-sdk

    refresh_erd_snapshot:
      name: "erd-explorer-refresh-snapshot-${bundle.target}"
      description: >-
        Materializes the ERD metadata (tables/columns/PKs/FKs/tags) into the
        erd_snapshot_* Delta tables in erd_metadata_location, so the app can serve the
        graph without the expensive information_schema joins on every load (see
        setup/build_erd_snapshot.py + var.erd_metadata_source="snapshot"). Runs weekly to
        match the ~weekly cadence objects are deployed. Enable the fast path with:
        (1) deploy --var="erd_metadata_source=snapshot", (2) `databricks bundle run
        refresh_erd_snapshot` once to populate immediately, (3) UNPAUSE the schedule below
        (or set pause_status UNPAUSED and redeploy) for ongoing weekly refresh. Left PAUSED
        by default so it does no work until snapshot mode is actually enabled.
      schedule:
        # Weekly, Sundays 08:00 UTC. PAUSED until snapshot mode is enabled (see above).
        quartz_cron_expression: "0 0 8 ? * SUN"
        timezone_id: "UTC"
        pause_status: "PAUSED"
      tasks:
        - task_key: build_erd_snapshot
          environment_key: default
          spark_python_task:
            python_file: ./setup/build_erd_snapshot.py
            # No --profile: on job compute the script uses ambient WorkspaceClient() auth
            # (the job's identity) -- the snapshot reflects what that identity can see.
            parameters:
              - "--warehouse-id"
              - ${var.warehouse_id}
              - "--catalogs"
              - ${var.erd_catalogs}
              - "--metadata-location"
              - ${var.erd_metadata_location}
      environments:
        - environment_key: default
          spec:
            client: "3"
            dependencies:
              - databricks-sdk
