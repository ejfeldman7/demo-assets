bundle:
  name: workload_watchtower

# All values are supplied at deploy time from setup/config.env (setup/setup.sh passes them
# as --var flags). No environment-specific defaults are committed here.
variables:
  warehouse_id:
    description: SQL warehouse ID for UC Delta DDL / reads and live list-price lookups.
  uc_schema:
    description: Unity Catalog <catalog>.<schema> for append-only history (snapshots/alerts).
  lakebase_endpoint:
    description: Autoscaling Lakebase endpoint path (projects/<p>/branches/<b>/endpoints/<e>).
  lakebase_host:
    description: Lakebase read-write endpoint host.
  lakebase_schema:
    description: Postgres schema holding the app's triage state.
    default: watchtower
  secret_scope:
    description: Databricks secret scope holding SMTP settings (email automations).
    default: watchtower
  poller_schedule:
    description: Quartz cron for the poll interval.
    default: "0 0/5 * * * ?"

resources:
  jobs:
    # ── Core poller: reads live workload state on the schedule below ────────────
    watchtower_poller:
      name: watchtower-poller
      description: "Polls live Databricks APIs for long-running / costly workloads."
      # Re-pause by flipping pause_status to PAUSED and redeploying.
      schedule:
        quartz_cron_expression: ${var.poller_schedule}
        timezone_id: UTC
        pause_status: UNPAUSED
      # ── Native alerting (complements the app's in-app email automations) ────────────────────
      # RECOMMENDED: the `alert_check` task below evaluates the `watchtower_critical` SQL alert
      # right after each poll and notifies on new critical findings — content-based, and the job
      # still reports success (no failure-semantics abuse).
      # FALLBACK (no SQL warehouse): alert on job FAILURE instead — uncomment these and the poll
      # task's `--fail-on-critical=true` so a failed run means "a new critical was detected".
      # email_notifications:
      #   on_failure:
      #     - platform-oncall@example.com
      # webhook_notifications:      # IDs come from Settings → Notifications → system destinations
      #   on_failure:               # (Slack / PagerDuty / Teams / generic webhook)
      #     - id: <system-destination-id>
      tasks:
        - task_key: poll
          spark_python_task:
            python_file: src/poller/main.py
            # Serverless can't set arbitrary env vars, so deployment config is passed as
            # parameters; main.py translates these into the env vars the modules read.
            parameters:
              - "--warehouse-id=${var.warehouse_id}"
              - "--uc-schema=${var.uc_schema}"
              - "--lakebase-endpoint=${var.lakebase_endpoint}"
              - "--lakebase-host=${var.lakebase_host}"
              - "--lakebase-schema=${var.lakebase_schema}"
              - "--secret-scope=${var.secret_scope}"
              # Opt-in: exit non-zero when a NEW critical finding is raised, so the job's
              # on_failure notifications (above) fire. Off unless set true. See "Alerting options".
              # - "--fail-on-critical=true"
          environment_key: poller_env
        # ── Alert gate: evaluate the "new critical findings" SQL alert right after each poll ──
        # Runs on the poller's schedule (no separate alert schedule); succeeds whether or not it
        # fires, so it never turns the job red. Notifies via the alert's own subscriptions.
        - task_key: alert_check
          depends_on:
            - task_key: poll
          # alert_task = the AlertV2 task (sql_task.alert is the legacy path and can't see a v2
          # alert). Evaluates the alert and notifies its subscriptions; succeeds either way.
          alert_task:
            alert_id: ${resources.alerts.watchtower_critical.id}
            warehouse_id: ${var.warehouse_id}
      environments:
        - environment_key: poller_env
          spec:
            client: "3"
            dependencies:
              - "psycopg[binary]"
              # >=0.96.0 required: older SDKs on the serverless base image lack
              # w.postgres (Lakebase credential minting), and a loose pin won't upgrade.
              - "databricks-sdk>=0.96.0"

  # ── SQL Alert (v2): "new critical findings" — evaluated by the job's alert_check task ───────
  # Content-based native alerting over the append-only alert_events table. The task triggers this
  # right after each poll; on trigger it notifies the subscriptions below.
  alerts:
    watchtower_critical:
      display_name: "Workload Watchtower — new critical findings"
      warehouse_id: ${var.warehouse_id}
      # alert_events is appended ONLY when a finding first crosses a rule, so a short window is
      # "new criticals since the last poll" (self-deduping). Widen if you lengthen poller_schedule.
      query_text: |
        SELECT count(*) AS n
        FROM ${var.uc_schema}.alert_events
        WHERE severity = 'critical'
          AND event_ts >= current_timestamp() - INTERVAL 6 MINUTES
      evaluation:
        comparison_operator: GREATER_THAN     # alerts trigger when the condition is TRUE (n > 0)
        source:
          name: n
          display: n
        threshold:
          value:
            double_value: 0
        notification:
          notify_on_ok: false
          subscriptions:
            # Defaults to the deploying user. Add more emails, or a system destination
            # (Settings → Notifications) to route Slack / PagerDuty / Teams / webhook.
            - user_email: ${workspace.current_user.userName}
            # - destination_id: <system-destination-id>
      schedule:
        # PAUSED on purpose — the alert runs only via the job's alert_check task (no 2nd schedule).
        # quartz_cron_schedule + timezone_id are required by the API even when paused.
        pause_status: PAUSED
        quartz_cron_schedule: "0 0 0 * * ?"
        timezone_id: UTC

targets:
  default:
    default: true
    # Host + auth come from the CLI profile passed at deploy (`-p <profile>`) — do NOT set
    # workspace.host from a variable, as it must be known before variables are resolved.
    #
    # By default the poller runs as the deploying user, who must be a workspace admin (for
    # cross-user Query History / Jobs / Pipelines visibility). To run it as the app service
    # principal instead — so it isn't tied to a person — see docs/RUNBOOK.md ("Run the poller
    # as the app service principal"): grant your user `servicePrincipal.user` on the SP, then
    # add a `run_as: { service_principal_name: <app-sp-client-id> }` block here and redeploy.
