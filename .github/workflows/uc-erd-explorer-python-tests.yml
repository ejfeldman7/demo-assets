name: Python tests

# Pure unit tests only -- no real Databricks warehouse/credentials involved, so this is
# safe to run on every push/PR without storing any secrets in this repo. Real-warehouse
# verification (the setup scripts actually creating/granting things correctly) stays a
# manual, local step -- see README.md.

on:
  push:
    paths:
      - "uc_erd_explorer/server/**"
      - "uc_erd_explorer/setup/**"
      - "uc_erd_explorer/tests/**"
      - "uc_erd_explorer/pyproject.toml"
      - ".github/workflows/uc-erd-explorer-python-tests.yml"
  pull_request:
    paths:
      - "uc_erd_explorer/server/**"
      - "uc_erd_explorer/setup/**"
      - "uc_erd_explorer/tests/**"
      - "uc_erd_explorer/pyproject.toml"
      - ".github/workflows/uc-erd-explorer-python-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uc_erd_explorer
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - run: uv sync --group dev
      - run: uv run --group dev pytest tests/ -v
